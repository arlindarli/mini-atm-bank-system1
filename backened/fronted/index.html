<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Banking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ============ AUTH VIEW ============ -->
  <div id="authView" class="card">
    <div class="brand">
      <h1>Internet <b>BANKING</b></h1>
      <p id="authSubtitle">Sign in to your account</p>
    </div>

    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">Login</button>
      <button id="tabRegister" onclick="switchAuthTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label>PIN</label>
        <input type="password" id="loginPin" inputmode="numeric" placeholder="••••" required>
      </div>
      <button class="btn-primary" type="submit" id="loginBtn">Sign In</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" onsubmit="return handleRegister(event)" style="display:none;">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="regFullName" placeholder="Jane Doe" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label>PIN</label>
          <input type="password" id="regPin" inputmode="numeric" placeholder="••••" required>
        </div>
      </div>
      <button class="btn-primary" type="submit" id="registerBtn">Create Account</button>
    </form>

    <div id="authMsg" class="auth-msg"></div>

    <details class="api-config">
      <summary>API server settings</summary>
      <div class="field">
        <label>Backend URL</label>
        <input type="text" id="apiBase" value="http://localhost:3000">
      </div>
    </details>
  </div>

  <!-- ============ DASHBOARD VIEW ============ -->
  <div id="dashboardView" class="card">
    <div class="profile-dot" onclick="handleLogout()" title="Log out">⏻</div>
    <div class="brand">
      <h1>Internet <b>BANKING</b></h1>
      <p>My Account</p>
    </div>
    <div class="acct-line"><span id="acctNumber">•••• ••••</span></div>

    <div class="dash-body">
      <div class="period-tabs" id="periodTabs">
        <button class="active" data-period="day" onclick="setPeriod('day')"><span class="arrow">▸</span>Day</button>
        <button data-period="week" onclick="setPeriod('week')"><span class="arrow">▸</span>Week</button>
        <button data-period="month" onclick="setPeriod('month')"><span class="arrow">▸</span>Month</button>
        <button data-period="year" onclick="setPeriod('year')"><span class="arrow">▸</span>Year</button>
      </div>

      <div class="balance-orb">
        <div class="amt"><span class="cur">$</span><span id="balanceAmt">0</span></div>
        <div class="lbl">Balance</div>
      </div>

      <div class="side-icons">
        <button title="Refresh" onclick="refreshAll()">↻</button>
        <button title="History" onclick="toggleTxPanel(true)">≡</button>
      </div>
    </div>

    <div class="actions-row">
      <button class="action-circle deposit" onclick="openModal('deposit')">
        <span class="ic">↓</span>Deposit
      </button>
      <button class="action-circle withdraw" onclick="openModal('withdraw')">
        <span class="ic">↑</span>Withdraw
      </button>
      <button class="action-circle transfer" onclick="openModal('transfer')">
        <span class="ic">⇄</span>Transfer
      </button>
    </div>

    <div class="divider"></div>

    <div class="bottom-icons">
      <button onclick="refreshAll()" title="Refresh">↻</button>
      <button id="txToggleBtn" onclick="toggleTxPanel()" title="Transactions">☰</button>
      <button onclick="handleLogout()" title="Log out">⏻</button>
    </div>

    <div id="txPanel" class="tx-panel">
      <div class="tx-summary">
        <div class="box in"><div class="k">In (period)</div><div class="v" id="sumIn">$0</div></div>
        <div class="box out"><div class="k">Out (period)</div><div class="v" id="sumOut">$0</div></div>
      </div>
      <div id="txList"></div>
    </div>
  </div>

</div>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Deposit</h3>
    <form id="modalForm" onsubmit="return handleModalSubmit(event)">
      <div class="field" id="toAccountField" style="display:none;">
        <label>Recipient account number</label>
        <input type="text" id="modalToAccount" placeholder="Account number">
      </div>
      <div class="field">
        <label>Amount</label>
        <input type="number" id="modalAmount" placeholder="0.00" step="0.01" min="0.01" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary" id="modalSubmitBtn">Confirm</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
